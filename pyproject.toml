[project]
name = "skyrmion"
version = "0.1.0"
description = "Python package to analyze spatial organization of skyrmions"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "ksiller", email = "khsiller@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bioio-emd>=0.1.0.dev1",
    "vistiq[all]",
]

[project.scripts]
skyrmion = "skyrmion:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
vistiq = { git = "https://github.com/ksiller/vistiq.git" }
